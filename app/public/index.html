<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Quiz Docker</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    fieldset { margin-bottom: 1rem; }
    button { padding: .5rem 1rem; }
  </style>
</head>
<body>
  <h1>Quiz Docker</h1>
  <input id="nome" placeholder="Seu nome">
  <div id="perguntas"></div>
  <button id="enviar">Enviar</button>
  <p id="resultado"></p>

  <h2>Últimos resultados</h2>
  <ul id="lista"></ul>

  <script>
    async function carregarPerguntas() {
      const perguntas = await (await fetch('/api/perguntas')).json();
      const div = document.getElementById('perguntas');
      perguntas.forEach((p, i) => {
        const fs = document.createElement('fieldset');
        const lg = document.createElement('legend');
        lg.textContent = p.texto;
        fs.appendChild(lg);
        p.opcoes.forEach((o, j) => {
          const label = document.createElement('label');
          const input = document.createElement('input');
          input.type = 'radio'; input.name = 'p' + i; input.value = j;
          label.appendChild(input);
          label.appendChild(document.createTextNode(' ' + o));
          fs.appendChild(label);
          fs.appendChild(document.createElement('br'));
        });
        div.appendChild(fs);
      });
    }

    async function carregarLista() {
      const dados = await (await fetch('/api/resultados')).json();
      const ul = document.getElementById('lista');
      ul.innerHTML = '';
      dados.forEach(r => {
        const li = document.createElement('li');
        li.textContent = `${r.nome}: ${r.acertos}/${r.total}`;
        ul.appendChild(li);
      });
    }

    document.getElementById('enviar').onclick = async () => {
      const nome = document.getElementById('nome').value.trim();
      const respostas = [...document.querySelectorAll('fieldset')].map((_, i) => {
        const sel = document.querySelector(`input[name="p${i}"]:checked`);
        return sel ? Number(sel.value) : -1;
      });
      const r = await fetch('/api/respostas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, respostas })
      });
      const dados = await r.json();
      document.getElementById('resultado').textContent =
        r.ok ? `Você acertou ${dados.acertos} de ${dados.total}!` : dados.erro;
      carregarLista();
    };

    carregarPerguntas();
    carregarLista();
  </script>
</body>
</html>
